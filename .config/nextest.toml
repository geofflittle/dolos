# A test is large when it dials a public network peer or runs a container image, medium when it reads a file outside its temporary directory, opens a socket or starts a process, and small otherwise.
# Each size's time limit is Bazel's default, https://bazel.build/reference/test-encyclopedia#role-test-runner.

[test-groups]
small = { max-threads = "num-cpus" }
medium = { max-threads = "num-cpus" }
large = { max-threads = "num-cpus" }

# The e2e daemon tests take their ports from a counter that starts again in each test process, so each runs alone.
[[profile.default.overrides]]
filter = 'binary_id(dolos::smoke) | binary_id(dolos::snapshot) | binary_id(dolos::sync)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = '''
    (binary_id(dolos-minibf) & (
      test(=routes::governance::tests::governance_drep_metadata_returns_anchor_error)
      | test(=routes::governance::tests::governance_proposal_metadata_by_gov_action_returns_anchor_error)
      | test(=routes::governance::tests::governance_proposal_metadata_returns_404_when_fetch_fails)
    ))
  | binary_id(dolos-snapshot::restore_registry)
  | binary_id(dolos-snapshot::snapshot_verify)
  | (binary_id(dolos::bin/dolos) & (
      test(/^bootstrap::ranged::/)
    ))
  | (binary_id(dolos::smoke) & (
      test(=daemon_runs_for_mainnet_full_implicit)
      | test(=daemon_runs_for_preprod_full_implicit)
      | test(=daemon_runs_for_preview_full_explicit)
      | test(=daemon_runs_for_preview_full_implicit)
      | test(=daemon_runs_for_preview_min_implicit)
    ))
  | binary_id(dolos::snapshot)
  | (binary_id(dolos::sync) & (
      test(=daemon_syncs_for_mainnet_full_implicit)
      | test(=daemon_syncs_for_preprod_full_implicit)
      | test(=daemon_syncs_for_preview_full_explicit)
      | test(=daemon_syncs_for_preview_full_implicit)
      | test(=daemon_syncs_for_preview_min_implicit)
    ))
'''
test-group = "large"
slow-timeout = { period = "900s", terminate-after = 1 }

