[package]
name = "reference-comparison"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
served = ["dep:dolos-cardano"]

[dependencies]
dolos-cardano = { path = "../crates/cardano", optional = true }

[dev-dependencies]
cddl = "0.10.7"
ledger-oracle-judge = { path = "../crates/ledger-oracle-judge" }
pallas = { path = "../../pallas-head/pallas", features = ["unstable"] }
pallas-codec = { path = "../../pallas-head/pallas-codec" }
pallas-crypto = { path = "../../pallas-head/pallas-crypto" }
pallas-primitives = { path = "../../pallas-head/pallas-primitives", features = ["unstable"] }
serde_json = "1.0.140"
hex = "0.4.3"

[[test]]
name = "classes"
path = "tests/classes/main.rs"

[[test]]
name = "decode"
path = "tests/decode/main.rs"

[[test]]
name = "served"
path = "tests/served/main.rs"
required-features = ["served"]

[[test]]
name = "networking"
path = "tests/networking/main.rs"

[[test]]
name = "mapping"
path = "tests/mapping/main.rs"

[patch."https://github.com/SundaeSwap-finance/pallas"]
pallas = { path = "../../pallas-head/pallas" }
pallas-addresses = { path = "../../pallas-head/pallas-addresses" }
pallas-codec = { path = "../../pallas-head/pallas-codec" }
pallas-configs = { path = "../../pallas-head/pallas-configs" }
pallas-crypto = { path = "../../pallas-head/pallas-crypto" }
pallas-hardano = { path = "../../pallas-head/pallas-hardano" }
pallas-network = { path = "../../pallas-head/pallas-network" }
pallas-network2 = { path = "../../pallas-head/pallas-network2" }
pallas-primitives = { path = "../../pallas-head/pallas-primitives" }
pallas-traverse = { path = "../../pallas-head/pallas-traverse" }
pallas-txbuilder = { path = "../../pallas-head/pallas-txbuilder" }
pallas-utxorpc = { path = "../../pallas-head/pallas-utxorpc" }
pallas-validate = { path = "../../pallas-head/pallas-validate" }

[patch.crates-io]
pallas = { path = "../../pallas-head/pallas" }
pallas-addresses = { path = "../../pallas-head/pallas-addresses" }
pallas-codec = { path = "../../pallas-head/pallas-codec" }
pallas-configs = { path = "../../pallas-head/pallas-configs" }
pallas-crypto = { path = "../../pallas-head/pallas-crypto" }
pallas-hardano = { path = "../../pallas-head/pallas-hardano" }
pallas-network = { path = "../../pallas-head/pallas-network" }
pallas-network2 = { path = "../../pallas-head/pallas-network2" }
pallas-primitives = { path = "../../pallas-head/pallas-primitives" }
pallas-traverse = { path = "../../pallas-head/pallas-traverse" }
pallas-txbuilder = { path = "../../pallas-head/pallas-txbuilder" }
pallas-utxorpc = { path = "../../pallas-head/pallas-utxorpc" }
pallas-validate = { path = "../../pallas-head/pallas-validate" }
