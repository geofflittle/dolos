# A comparison reads the ledger's records and pallas's CDDL from disk and is medium, and every other test is small.
# Each size's time limit is Bazel's default timeout for it: https://bazel.build/reference/test-encyclopedia#role-test-runner

[test-groups]
small = { max-threads = "num-cpus" }
medium = { max-threads = "num-cpus" }

# The count per rule of samples judged, allowed and failed shows in every run.
[[profile.default.overrides]]
filter = "binary_id(reference-comparison::dataset-*) & test(/^pallas_reads_the_[a-z]+_dataset_as_the_ledger_does$/)"
success-output = "immediate"

[[profile.default.overrides]]
filter = "test(/^(pallas_decodes_what_the_ledger_writes|pallas_maps_the_datums_the_ledger_finds|pallas_reads_the_utxo_replies_the_ledger_writes|pallas_reads_the_[a-z]+_dataset_as_the_ledger_does)$/)"
test-group = "medium"
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.default.overrides]]
filter = "all()"
test-group = "small"
slow-timeout = { period = "60s", terminate-after = 1 }
