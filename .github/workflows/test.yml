name: Test

on:
  workflow_call:
    inputs:
      archive:
        description: The name of the artifact that holds the archived tests.
        type: string
        default: nextest-archive
      cargo-args:
        description: The cargo arguments that choose the packages and features to test.
        type: string
        default: ""
      save-cache:
        description: Whether the build job saves its cache.
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # rust-cache hashes the CARGO variables into its key, so the CI jobs that
  # restore this job's cache set the same values.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# One job compiles the tests into a nextest archive and each size runs from it,
# https://nexte.st/docs/ci-features/archiving/
jobs:
  build:
    name: Build the tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-04
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          # Every caller restores one multi GB entry, which the default caller
          # saves.
          shared-key: test-ubuntu-latest
          save-if: ${{ inputs.save-cache }}

      - name: Archive the tests
        env:
          CARGO_ARGS: ${{ inputs.cargo-args }}
        run: |
          # shellcheck disable=SC2086
          cargo nextest archive --workspace --all-targets $CARGO_ARGS --archive-file nextest-archive.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.archive }}
          path: nextest-archive.tar.zst
          retention-days: 1

      # Doctests are small tests that nextest cannot archive.
      - name: Run the doctests
        env:
          CARGO_ARGS: ${{ inputs.cargo-args }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: timeout 60
        run: |
          # shellcheck disable=SC2086
          cargo test --workspace --doc $CARGO_ARGS

  sized:
    name: Test (${{ matrix.size }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        size: [small, medium, large]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.archive }}

      # The tests read `CARGO_BIN_EXE_dolos` and `CARGO_TARGET_TMPDIR` as
      # compiled, so the archive unpacks into the checkout.
      - run: mkdir -p target/tmp

      # The registry tests run this image, which is loaded before they start.
      - name: Restore the registry image
        if: matrix.size == 'large'
        id: registry-image
        uses: actions/cache@v4
        with:
          path: registry-image.tar
          key: registry-image-2
      - name: Save the registry image
        if: matrix.size == 'large' && steps.registry-image.outputs.cache-hit != 'true'
        run: docker pull registry:2 && docker save registry:2 --output registry-image.tar
      - name: Load the registry image
        if: matrix.size == 'large'
        run: docker load --input registry-image.tar

      # The judge is a medium test that the judge job runs in release.
      - name: Run the ${{ matrix.size }} tests
        run: cargo-nextest nextest run --archive-file nextest-archive.tar.zst --extract-to "$GITHUB_WORKSPACE" --extract-overwrite --no-fail-fast --no-tests fail --run-ignored all -E 'group(${{ matrix.size }}) - (package(dolos) & kind(lib) & test(=serve::grpc::v1::ledger_oracle_tests::ledger_oracle))'
