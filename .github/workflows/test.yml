name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # rust-cache hashes the CARGO variables into its key, so the CI jobs that
  # restore this job's cache set the same values.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  sized:
    name: Test (${{ matrix.size }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        size: [small, medium, large]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-04
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          # Every size and `all-features` restore one multi GB entry, which the
          # small job saves.
          shared-key: test-ubuntu-latest
          save-if: ${{ matrix.size == 'small' }}

      # The judge is a medium test that the judge job runs in release.
      - name: Run the ${{ matrix.size }} tests
        run: cargo nextest run --workspace --all-targets --no-fail-fast --no-tests fail --run-ignored all -E 'group(${{ matrix.size }}) - (package(dolos) & kind(lib) & test(=serve::grpc::v1::ledger_oracle_tests::ledger_oracle))'

      - name: Run the doctests
        if: matrix.size == 'small'
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: timeout 60
        run: cargo test --workspace --doc
