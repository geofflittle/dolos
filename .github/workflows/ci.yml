name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line tables keep backtraces symbolicated at a fraction of the link time and
  # cache size. `dev` is the one that matters: `cargo test` builds dependencies
  # with it. Set here, not in `[profile.dev]`, so local debugging is unaffected.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    # rustfmt.toml enables `wrap_comments`, an unstable option that only the
    # nightly rustfmt applies — stable silently ignores it. Run nightly here so
    # the check actually enforces comment wrapping.
    #
    # Pinned, because unstable options give no output-stability guarantee: the
    # nightly published 2026-08-30 rewraps comments across 85 files. Held at the
    # last nightly that formats `main` clean; taking that rewrap is #1280.
    # Local devs: `cargo +nightly-2026-08-27 fmt`.
    env:
      RUSTFMT_NIGHTLY: nightly-2026-08-27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTFMT_NIGHTLY }}
          components: rustfmt
      - run: cargo +$RUSTFMT_NIGHTLY fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-04
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  deny:
    name: cargo deny (advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Fails the build on any RustSec advisory affecting the locked
      # dependency tree. Config lives in deny.toml. The action installs
      # cargo-deny and caches the advisory database.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans

  test:
    uses: ./.github/workflows/test.yml

  # AGENTS.md prescribes verifying with `--all-features`, which enables
  # feature-gated code (notably the `strict` epoch-coherence assertions in
  # dolos-cardano) that the default-features run never exercises. Keep it green
  # here so the prescribed verification and CI cannot drift apart. The three
  # service crates are excluded because their test fixtures import synthetic
  # chains that jump from genesis straight to epoch 2, tripping the strict
  # assertions inside the fixture itself; they keep full coverage in the
  # default-features run. Remove the exclusions once the fixtures build
  # epoch-coherent domains (see AGENTS.md, "Code Verification Requirements").
  all-features:
    name: Test (all features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-04
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ubuntu-latest
          save-if: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      # The judge is a medium test that the judge job of docker.yml runs in release.
      - run: cargo nextest run --workspace --all-targets --all-features --no-fail-fast --no-tests fail --run-ignored all --exclude dolos-minibf --exclude dolos-minikupo --exclude dolos-trp -E 'not (package(dolos) & kind(lib) & test(=serve::grpc::v1::ledger_oracle_tests::ledger_oracle))'

  # Keep the snapshot profile independently embeddable. The workspace build
  # can unify features through the Dolos binary, while an external consumer
  # compiles this package on its own. This check guards that headless shape.
  snapshot-features:
    name: Check (headless dolos-snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-04
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-ubuntu-latest
          save-if: false
      - run: cargo check -p dolos-snapshot --all-targets
