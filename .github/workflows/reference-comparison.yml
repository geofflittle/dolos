name: Reference comparison

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pallas_ref:
        description: The geofflittle/pallas commit to compare
        required: false
      comparisons:
        description: The comparisons to run, by test name, separated by spaces
        required: false

permissions:
  contents: read

env:
  PALLAS_REF: ${{ inputs.pallas_ref || '20223bc95abb6ae7536858a01ddeddaacd4b741c' }}
  COMPARISONS: ${{ inputs.comparisons || 'decode mapping networking' }}
  TOOLCHAIN: nightly-2026-09-04

jobs:
  select:
    name: select
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      comparisons: ${{ steps.select.outputs.comparisons }}
      planted: ${{ steps.select.outputs.planted }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reference-comparison
          persist-credentials: false
      - name: Select the comparisons and their planted defects
        id: select
        working-directory: reference-comparison
        run: |
          read -ra names <<< "$COMPARISONS"
          selected=$(printf '%s\n' "${names[@]}" | sort -u | jq -Rnc '[inputs | select(length > 0)]')
          if [ "$(jq length <<< "$selected")" -eq 0 ]; then
            echo "::error::no comparison is selected"
            exit 1
          fi
          for c in $(jq -r '.[]' <<< "$selected"); do
            if ! [ -f "tests/$c/main.rs" ]; then
              echo "::error::$c is not a comparison under tests"
              exit 1
            fi
            if [ "$(jq --arg c "$c" '[.[] | select(.test == $c)] | length' planted-defects/planted.json)" -eq 0 ]; then
              echo "::error::the $c comparison has no planted defect"
              exit 1
            fi
          done
          planted=$(jq -c --argjson s "$selected" '[.[] | select(.test as $t | $s | index($t))]' planted-defects/planted.json)
          if ! jq -e 'all(.pallas | type == "string" and test("^[0-9a-f]{40}$"))' <<< "$planted" > /dev/null; then
            echo "::error::a planted defect names no pallas commit to plant into"
            exit 1
          fi
          echo "comparisons=$selected" >> "$GITHUB_OUTPUT"
          echo "planted=$planted" >> "$GITHUB_OUTPUT"
          echo "Comparisons at $PALLAS_REF: $selected" >> "$GITHUB_STEP_SUMMARY"

  # The judge's small tests and every small test of the selected comparisons.
  small:
    name: small
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: dolos
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/pallas
          ref: ${{ env.PALLAS_REF }}
          path: pallas-head
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dolos -> target
            dolos/reference-comparison -> target
          key: small
      - name: judge
        working-directory: dolos
        run: cargo nextest run --no-fail-fast --run-ignored all -p ledger-oracle-judge -E 'group(small)'
      - name: comparisons
        working-directory: dolos/reference-comparison
        env:
          SELECTED: ${{ needs.select.outputs.comparisons }}
        run: |
          binaries=$(jq -r 'map("binary(=" + . + ")") | join(" | ")' <<< "$SELECTED")
          cargo nextest run --no-fail-fast --run-ignored all -E "group(small) & ($binaries)"

  # The judge's medium tests and the medium tests of the selected comparisons.
  medium:
    name: medium
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: dolos
          submodules: true
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/pallas
          ref: ${{ env.PALLAS_REF }}
          path: pallas-head
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            dolos -> target
            dolos/reference-comparison -> target
          key: medium
      - name: judge
        working-directory: dolos
        run: cargo nextest run --no-fail-fast --run-ignored all -p ledger-oracle-judge -E 'group(medium)'
      - name: comparisons
        working-directory: dolos/reference-comparison
        env:
          SELECTED: ${{ needs.select.outputs.comparisons }}
        run: |
          binaries=$(jq -r 'map("binary(=" + . + ")") | join(" | ")' <<< "$SELECTED")
          rc=0
          cargo nextest run --no-fail-fast --run-ignored all --no-capture -E "group(medium) & ($binaries)" || rc=$?
          case "$rc" in
            0) ;;
            100) echo "::error::a comparison judged a difference or ran over its time limit"; exit 1 ;;
            *) echo "::error::the comparisons exited $rc before judging, a build failure or a crash"; exit 1 ;;
          esac

  # A planted defect and its expected lines hold for one pallas commit, so
  # each one runs at the commit it names, whatever ref is compared.
  planted:
    name: planted ${{ matrix.planted }}
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.planted) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: dolos
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/pallas
          ref: ${{ matrix.pallas }}
          path: pallas-head
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dolos/reference-comparison -> target
          save-if: false
      - name: Record the failure lines without the planted defect
        working-directory: dolos/reference-comparison
        run: |
          rc=0
          cargo nextest run --no-fail-fast --test ${{ matrix.test }} --no-capture > "$RUNNER_TEMP/clean.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/clean.out"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 100 ]; then
            echo "::error::the run exited $rc, which is neither a pass nor a failing test"
            exit 1
          fi
          awk '/panicked at tests\//{f=1;next} f&&(/^note:/||/^$/||/^test /){f=0} f' "$RUNNER_TEMP/clean.out" | sort > "$RUNNER_TEMP/clean"
      - name: Apply the planted defect
        working-directory: ${{ matrix.patched }}
        env:
          PATCH: ${{ github.workspace }}/dolos/reference-comparison/planted-defects/${{ matrix.planted }}.patch
        run: |
          git apply --check "$PATCH"
          git apply "$PATCH"
          if git diff --quiet; then
            echo "::error::$PATCH changed nothing in ${{ matrix.patched }}"
            exit 1
          fi
          git diff --stat
      - name: Compare the failure lines the planted defect adds
        working-directory: dolos/reference-comparison
        env:
          EXPECTED: ${{ toJSON(matrix.expected) }}
        run: |
          rc=0
          cargo nextest run --no-fail-fast --test ${{ matrix.test }} --no-capture > "$RUNNER_TEMP/planted.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/planted.out"
          if [ "$rc" -ne 100 ]; then
            echo "::error::the run exited $rc, and a failing test exits 100"
            exit 1
          fi
          awk '/panicked at tests\//{f=1;next} f&&(/^note:/||/^$/||/^test /){f=0} f' "$RUNNER_TEMP/planted.out" | sort > "$RUNNER_TEMP/planted"
          comm -13 "$RUNNER_TEMP/clean" "$RUNNER_TEMP/planted" > "$RUNNER_TEMP/added"
          comm -23 "$RUNNER_TEMP/clean" "$RUNNER_TEMP/planted" > "$RUNNER_TEMP/removed"
          jq -r '.[]' <<< "$EXPECTED" | sort > "$RUNNER_TEMP/expected"
          if ! diff "$RUNNER_TEMP/expected" "$RUNNER_TEMP/added" || [ -s "$RUNNER_TEMP/removed" ]; then
            echo "::error::the failure lines the planted defect changes differ from its expected lines"
            cat "$RUNNER_TEMP/removed"
            exit 1
          fi
          echo "added failure lines: $(wc -l < "$RUNNER_TEMP/added"), as expected"

  coverage:
    name: coverage
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COVERED: pallas-primitives,pallas-codec,pallas-network
      SELECTED: ${{ needs.select.outputs.comparisons }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: dolos
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/pallas
          ref: ${{ env.PALLAS_REF }}
          path: pallas-head
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151,cargo-llvm-cov@0.9.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dolos/reference-comparison -> target
          key: coverage
      - name: Remove the profiles of earlier runs
        working-directory: dolos/reference-comparison
        run: cargo llvm-cov clean --workspace
      # Each comparison runs alone, so one that fails to build leaves the
      # coverage of the others in the report and fails the job.
      - name: Run the selected comparisons with coverage
        working-directory: dolos/reference-comparison
        run: |
          failed=0
          for c in $(jq -r '.[]' <<< "$SELECTED"); do
            rc=0
            cargo llvm-cov nextest --no-report --branch --ignore-run-fail --dep-coverage "$COVERED" --test "$c" || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::the $c comparison exited $rc under coverage, a build failure or a crash"
              failed=1
            fi
          done
          exit "$failed"
      # The report keeps every instrumented source except test files, and the runs
      # instrument the pallas crates they name beside the comparison's tests.
      - name: Report the coverage of the compared pallas crates
        if: ${{ !cancelled() }}
        working-directory: dolos/reference-comparison
        run: |
          cargo llvm-cov report --branch --lcov --output-path "$RUNNER_TEMP/lcov.info"
          cargo llvm-cov report --branch --html --output-dir "$RUNNER_TEMP/coverage"
          cargo llvm-cov report --branch > "$RUNNER_TEMP/summary.txt"
          if ! grep -q 'dijkstra' "$RUNNER_TEMP/summary.txt" || ! [ -s "$RUNNER_TEMP/lcov.info" ]; then
            echo "::error::the report holds no Dijkstra source, so the pallas crates were not measured"
            cat "$RUNNER_TEMP/summary.txt"
            exit 1
          fi
          {
            echo "### Coverage of pallas-primitives, pallas-codec and pallas-network at $PALLAS_REF under $SELECTED"
            echo '```'
            head -n 2 "$RUNNER_TEMP/summary.txt"
            grep -E 'dijkstra|^TOTAL' "$RUNNER_TEMP/summary.txt"
            echo '```'
            echo 'The lcov file and the HTML report are in the coverage artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/lcov.info" "$RUNNER_TEMP/summary.txt" "$RUNNER_TEMP/coverage/"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
