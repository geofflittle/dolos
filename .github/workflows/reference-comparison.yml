name: Reference comparison

on:
  push:
    paths:
      - .github/workflows/reference-comparison.yml
      - crates/ledger-oracle-judge/**
      - reference-comparison/**
  pull_request:
    paths:
      - .github/workflows/reference-comparison.yml
      - crates/ledger-oracle-judge/**
      - reference-comparison/**
  workflow_dispatch:
    inputs:
      pallas_ref:
        description: The geofflittle/pallas commit to compare
        required: false

permissions:
  contents: read

env:
  PALLAS_REF: ${{ inputs.pallas_ref || 'adb44159a4ca20e8f70d8cada66c93d505aa8ca9' }}
  TOOLCHAIN: nightly-2026-09-04

jobs:
  compare:
    name: compare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: dolos
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/pallas
          ref: ${{ env.PALLAS_REF }}
          path: pallas-head
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dolos/reference-comparison -> target
      - name: Build the comparison tests
        working-directory: dolos/reference-comparison
        run: cargo nextest run --no-run
      - name: decode
        if: ${{ !cancelled() }}
        working-directory: dolos/reference-comparison
        run: cargo nextest run --test decode --no-capture
      - name: networking
        if: ${{ !cancelled() }}
        working-directory: dolos/reference-comparison
        run: cargo nextest run --test networking --no-capture
      - name: mapping
        if: ${{ !cancelled() }}
        working-directory: dolos/reference-comparison
        run: cargo nextest run --test mapping --no-capture

  planted:
    name: planted ${{ matrix.planted }}
    if: ${{ !inputs.pallas_ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - planted: rational-tag-refused
            patched: pallas-head
            test: decode
            expected: |
              decode: listed a rational under another tag (defect: a rational reads any tag) in class "body rational-tag" matched no observation
              decode: listed a rational under another tag (defect: a rational reads any tag) in class "ppu rational-tag" matched no observation
              decode: listed a rational under another tag (defect: a rational reads any tag) in class "ppu zap" matched no observation
          - planted: tx-zap-entry-removed
            patched: dolos
            test: decode
            expected: |
              decode: class "tx zap" disagrees (accepts) 4
          - planted: networking-datum-hash-flipped
            patched: pallas-head
            test: networking
            expected: |
              networking: class "conway-utxo datum-hash" disagrees (values) 10
              networking: class "dijkstra-utxo datum-hash" disagrees (values) 10
          - planted: mapping-sub-own-witnesses
            patched: pallas-head
            test: mapping
            expected: |
              mapping: class "top-witness first v1 sub 0 output 0 bytes" disagrees (values) 10
              mapping: class "top-witness first v1 sub 0 output 0 payload" disagrees (values) 10
              mapping: class "top-witness first v1alpha sub 0 output 0 payload" disagrees (values) 10
              mapping: class "top-witness first v1beta sub 0 output 0 payload" disagrees (values) 10
              mapping: class "top-witness later v1 sub 1 output 0 bytes" disagrees (values) 10
              mapping: class "top-witness later v1 sub 1 output 0 payload" disagrees (values) 10
              mapping: class "top-witness later v1alpha sub 1 output 0 payload" disagrees (values) 10
              mapping: class "top-witness later v1beta sub 1 output 0 payload" disagrees (values) 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: dolos
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/pallas
          ref: ${{ env.PALLAS_REF }}
          path: pallas-head
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dolos/reference-comparison -> target
          save-if: false
      - name: Record the failure lines without the planted defect
        working-directory: dolos/reference-comparison
        run: |
          rc=0
          cargo nextest run --no-fail-fast --test ${{ matrix.test }} --no-capture > "$RUNNER_TEMP/clean.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/clean.out"
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 100 ]; then
            echo "::error::the run exited $rc, which is neither a pass nor a failing test"
            exit 1
          fi
          awk '/panicked at tests\//{f=1;next} f&&(/^note:/||/^$/||/^test /){f=0} f' "$RUNNER_TEMP/clean.out" | sort > "$RUNNER_TEMP/clean"
      - name: Apply the planted defect
        working-directory: ${{ matrix.patched }}
        env:
          PATCH: ${{ github.workspace }}/dolos/reference-comparison/planted-defects/${{ matrix.planted }}.patch
        run: |
          git apply --check "$PATCH"
          git apply "$PATCH"
          if git diff --quiet; then
            echo "::error::$PATCH changed nothing in ${{ matrix.patched }}"
            exit 1
          fi
          git diff --stat
      - name: Compare the failure lines the planted defect adds
        working-directory: dolos/reference-comparison
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          rc=0
          cargo nextest run --no-fail-fast --test ${{ matrix.test }} --no-capture > "$RUNNER_TEMP/planted.out" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/planted.out"
          if [ "$rc" -ne 100 ]; then
            echo "::error::the run exited $rc, and a failing test exits 100"
            exit 1
          fi
          awk '/panicked at tests\//{f=1;next} f&&(/^note:/||/^$/||/^test /){f=0} f' "$RUNNER_TEMP/planted.out" | sort > "$RUNNER_TEMP/planted"
          comm -13 "$RUNNER_TEMP/clean" "$RUNNER_TEMP/planted" > "$RUNNER_TEMP/added"
          comm -23 "$RUNNER_TEMP/clean" "$RUNNER_TEMP/planted" > "$RUNNER_TEMP/removed"
          printf '%s' "$EXPECTED" | sort > "$RUNNER_TEMP/expected"
          if ! diff "$RUNNER_TEMP/expected" "$RUNNER_TEMP/added" || [ -s "$RUNNER_TEMP/removed" ]; then
            echo "::error::the failure lines the planted defect changes differ from its expected lines"
            cat "$RUNNER_TEMP/removed"
            exit 1
          fi
          echo "added failure lines: $(wc -l < "$RUNNER_TEMP/added"), as expected"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: dolos
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: geofflittle/pallas
          ref: ${{ env.PALLAS_REF }}
          path: pallas-head
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151,cargo-llvm-cov@0.9.2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dolos/reference-comparison -> target
          key: coverage
      - name: Run the comparison tests with coverage
        working-directory: dolos/reference-comparison
        run: cargo llvm-cov nextest --no-report --branch --ignore-run-fail --no-fail-fast
      - name: Report the coverage of the compared pallas crates
        working-directory: dolos/reference-comparison
        run: |
          deps=pallas-primitives,pallas-codec,pallas-network
          cargo llvm-cov report --branch --dep-coverage "$deps" --lcov --output-path "$RUNNER_TEMP/lcov.info"
          cargo llvm-cov report --branch --dep-coverage "$deps" --html --output-dir "$RUNNER_TEMP/coverage"
          cargo llvm-cov report --branch --dep-coverage "$deps" > "$RUNNER_TEMP/summary.txt"
          {
            echo "### Coverage of pallas-primitives, pallas-codec and pallas-network at $PALLAS_REF"
            echo '```'
            head -n 2 "$RUNNER_TEMP/summary.txt"
            grep -E 'dijkstra|^TOTAL' "$RUNNER_TEMP/summary.txt"
            echo '```'
            echo 'The lcov file and the HTML report are in the coverage artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          cp "$RUNNER_TEMP/lcov.info" "$RUNNER_TEMP/summary.txt" "$RUNNER_TEMP/coverage/"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ runner.temp }}/coverage
