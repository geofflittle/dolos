name: Docker
on:
  push:
    branches:
      - "**"
    tags:
      - "leios-musashi-*"

jobs:
  test:
    if: false
    uses: ./.github/workflows/test.yml

  judge:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-04
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: judge

      - name: Judge Dolos against the ledger corpora
        run: cargo nextest run --release -p dolos --lib --no-tests fail --no-capture -E 'test(=serve::grpc::v1::ledger_oracle_tests::ledger_oracle)'

  pallas-ci:
    name: Require pallas CI at the pinned commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Find a successful pallas CI push run for each pallas commit in Cargo.lock
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pins=$(python3 - <<'EOF'
          import re, sys, tomllib
          with open("Cargo.lock", "rb") as f:
              packages = tomllib.load(f)["package"]
          pins = set()
          for p in packages:
              if p["name"] != "pallas" and not p["name"].startswith("pallas-"):
                  continue
              m = re.fullmatch(r"git\+https://github\.com/([\w.-]+/[\w.-]+?)(?:\.git)?(?:\?[^#]*)?#([0-9a-f]{40})", p.get("source", ""))
              if m is None:
                  sys.exit(f"{p['name']} {p['version']} is not pinned to a GitHub commit: {p.get('source', 'a path dependency')}")
              pins.add(m.groups())
          if not pins:
              sys.exit("Cargo.lock has no pallas package")
          for repo, sha in sorted(pins):
              print(repo, sha)
          EOF
          )
          bash .github/scripts/require-pallas-ci.sh <<< "$pins"

  build:
    strategy:
      matrix:
        include:
          - release_for: Linux-x86_64
            build_on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--locked --release"

          - release_for: Linux-arm64
            build_on: ubuntu-22.04-arm
            target: "aarch64-unknown-linux-gnu"
            args: "--locked --release"

    runs-on: ${{ matrix.build_on }}
    env:
        GIT_REVISION: "${{ github.sha }}"

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release"

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Run cargo build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --target ${{ matrix.target }} ${{ matrix.args }}

      - name: rename binaries
        run: |
          mv target/${{ matrix.target }}/release/dolos${{ matrix.ext }} dolos-${{ matrix.release_for }}${{ matrix.ext }}

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.release_for }}
          path: dolos-${{ matrix.release_for }}${{ matrix.ext }}

  ci-passed:
    if: always()
    needs: [build, test, judge, pallas-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}

  docker:
    if: github.ref == 'refs/heads/leios-musashi' || startsWith(github.ref, 'refs/tags/leios-musashi-')
    runs-on: ubuntu-latest
    needs: [build, test, judge, pallas-ci]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sundaeswap-finance/dolos
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/leios-musashi' }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/leios-musashi-') }}
            type=sha

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: .github/image/bin

      # we need to rename the artifact so that the name matches
      # the value that Docker uses for TARGET_ARCH to keep the
      # Dockerfile simple
      - name: Rename artifacts
        run: |+
          mv .github/image/bin/dolos-Linux-x86_64 .github/image/bin/dolos-Linux-amd64

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .github/image
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
