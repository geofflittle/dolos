# The fix commits of the Dolos fork and of the pallas commit it pins, each with the arm that plants its defect back or the reason no arm does.
# An exclusion names one of the reasons in FIX_EXCLUSION_REASONS of lib.sh.
# Each catch under catches is a failing verdict line an arm must add on one of its records: judge= and entry= name what judged it, each other term is cells of which it holds one, a ! term a cell it lacks, a member ending in * any member it starts, and test= a crate test that panics.

