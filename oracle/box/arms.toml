  { commit = "782168b16", exclude = "pin" },
  { commit = "1bc9e6a23", exclude = "pin" },
  { commit = "6aa0e5102", exclude = "pin" },
  { commit = "050a69752", exclude = "relay" },
  { commit = "7f188c640", exclude = "gap", why = "phase two at the pin accepts every judged transaction with no redeemers, so its revert changes no verdict" },
  { commit = "c6dd7d68e", arm = "estimate-needs-vkeys" },
