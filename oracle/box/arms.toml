  { commit = "b72b240b3", exclude = "pin" },
  { commit = "7258706ef", arm = "inflight" },
  { commit = "44e8bb770", exclude = "gap", why = "no record has an evaluation pallas reports as unsupported" },
  { commit = "9f5584bcd", exclude = "follower" },
