# The fix commits of the Dolos fork and of the pallas commit it pins, each with the arm that plants its defect back or the reason no arm does.
# An exclusion names one of these reasons: oracle (the oracle's own scripts, checked by lib_test.sh), pin (adopts pallas commits listed under pallas), lint (no behaviour change), tooling (scripts outside Dolos), relay (the relay to the node, which no judge drives), follower (chain following, epoch state and the mempool across blocks, judged by the live leg and not by an arm), network (node to node mini protocols, judged by the live leg), conway (Conway and earlier era paths, which Musashi transactions no longer reach), gap (an arm that plants the defect back and no judge catches, its why naming the miss), unrevertable (a revert that does not apply or build at the pin, its why naming the conflict).

[dolos]
base = "ce3d042ee9"
fixes = [
  { commit = "c64a3ca82", exclude = "oracle" },
  { commit = "3c232ab24", exclude = "oracle" },
  { commit = "a35a0a9d3", exclude = "oracle" },
  { commit = "77048fa61", exclude = "oracle" },
  { commit = "429066a41", arm = "requests-scripts-reverted" },
  { commit = "185925e76", exclude = "lint" },
  { commit = "3c5f56c92", arm = "v1-guarding" },
  { commit = "89e2b9159", arm = "horizon-unbounded" },
  { commit = "8cbc1861a", exclude = "gap", why = "no judged datum query searches a sub transaction" },
  { commit = "c4a1f5fac", exclude = "follower" },
  { commit = "7bab64ec5", arm = "system-start" },
  { commit = "831c92c10", exclude = "follower" },
  { commit = "61e820f8e", exclude = "follower" },
  { commit = "31f35f622", arm = "revalidate" },
  { commit = "948ef6f64", arm = "archive-outputs-only" },
